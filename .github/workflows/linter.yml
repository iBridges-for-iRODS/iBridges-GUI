name: Python package

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '_quarto.yml'
      - 'index.qmd'
      
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '_quarto.yml'
      - 'index.qmd'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (libEGL)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y mesa-utils

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]

    - name: Set QT to offscreen mode to prevent GUI error
      run: |
        if [[ $RUNNER_OS == 'Linux' || $RUNNER_OS == 'macOS' ]]; then
          export QT_QPA_PLATFORM=offscreen
        elif [ $RUNNER_OS == 'Windows' ]; then
          $env:QT_QPA_PLATFORM="offscreen"
        fi


    - name: Test with pytest
      run: |
        pytest tests


    - name: Lint with Ruff
      run: |
        ruff check ibridgesgui

    - name: Lint with PyLint
      run: |
        pylint ibridgesgui
