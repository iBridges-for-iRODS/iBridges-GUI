# Build executables on release and upload them as release assets.
# Can also be started manually (workflow_dispatch); then the zips are
# available as workflow artifacts instead.
# Based on https://github.com/Nuitka/Nuitka-Action
name: Build executables

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write  # needed to attach assets to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64); use macos-13 for Intel builds.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install Python dependencies
        run: pip install .[deploy]

      - name: Build and zip
        run: python build_tools/build_script.py --zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ibridgesgui_${{ runner.os }}
          path: ibridgesgui_*.zip

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ibridgesgui_*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
