name: Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # -----------------------------
      # Linux-only Qt dependencies
      # -----------------------------
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      # -----------------------------
      # Install Python dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]
          pip install pytest pytest-cov

      # -----------------------------
      # Set Qt to offscreen mode
      # -----------------------------
      - name: Configure Qt for headless mode
        run: |
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      # -----------------------------
      # Run tests (Linux uses Xvfb)
      # -----------------------------
      - name: Run tests (Linux)
        if: runner.os == 'Linux'
        run: |
            pytest tests

      # -----------------------------
      # Run tests (macOS only for Python 3.13)
      # -----------------------------
      - name: Configure Qt for headless mode (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          echo "QT_MAC_WANTS_LAYER=1" >> $GITHUB_ENV

      - name: Run tests (macOS)
        if: runner.os == 'macOS' && matrix.python-version == '3.13'
        run: |
          python -m pytest --cov=ibridgesgui --cov-report=term-missing tests
